<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">并行开发：从任务图到集成分支</title>
  <desc id="desc">任务图上的工单存在依赖关系，当前就绪的前沿工单被分给多个子 Agent，各自在独立 worktree 中按 TDD 实现，再汇入同一条集成分支并统一代码审查。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#52716b"/>
    </marker>
    <marker id="arrowReady" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#b78132"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #203b37; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #62736f; }
      .node { fill: #fffefa; stroke: #cdd8d1; stroke-width: 2; rx: 12; }
      .done { fill: #e4f0eb; stroke: #78a294; stroke-width: 2; rx: 12; }
      .ready { fill: #f7edda; stroke: #c99c4b; stroke-width: 2.5; rx: 12; }
      .agent { fill: #eef3f9; stroke: #7d97b6; stroke-width: 2; rx: 14; }
      .integration { fill: #e4f0eb; stroke: #78a294; stroke-width: 2.5; rx: 14; }
      .edge { fill: none; stroke: #9aafa5; stroke-width: 2.5; marker-end: url(#arrow); }
      .edgeReady { fill: none; stroke: #c99c4b; stroke-width: 2.5; marker-end: url(#arrowReady); }
      .flow { fill: none; stroke: #52716b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="660" rx="22" fill="#f4f2e9"/>
  <text x="48" y="55" class="title">并行开发：任务图 → 就绪前沿 → 多 worktree → 集成分支</text>

  <!-- task graph -->
  <text x="48" y="100" class="small">任务图（工单间的依赖）</text>
  <rect x="48" y="112" width="330" height="476" rx="18" fill="#eef3ee" stroke="#9aafa5" stroke-width="1.5"/>

  <rect x="86" y="150" width="120" height="52" class="done"/>
  <text x="146" y="182" class="body" text-anchor="middle">工单 T1 ✓</text>
  <rect x="86" y="236" width="120" height="52" class="done"/>
  <text x="146" y="268" class="body" text-anchor="middle">工单 T2 ✓</text>
  <rect x="240" y="150" width="110" height="52" class="ready"/>
  <text x="295" y="182" class="body" text-anchor="middle">T3 就绪</text>
  <rect x="240" y="236" width="110" height="52" class="ready"/>
  <text x="295" y="268" class="body" text-anchor="middle">T4 就绪</text>
  <rect x="160" y="330" width="120" height="52" class="node"/>
  <text x="220" y="362" class="body" text-anchor="middle">T5</text>
  <rect x="160" y="420" width="120" height="52" class="node"/>
  <text x="220" y="452" class="body" text-anchor="middle">T6</text>

  <path d="M146 202 L146 236" class="edge"/>
  <path d="M206 176 L240 176" class="edgeReady"/>
  <path d="M206 262 L240 262" class="edgeReady"/>
  <path d="M295 288 L295 330 L280 330" class="edge"/>
  <path d="M295 202 L295 236" class="edge"/>
  <path d="M220 382 L220 420" class="edge"/>
  <text x="66" y="540" class="small">黄色 = 当前「就绪前沿」</text>
  <text x="66" y="564" class="small">灰色 = 仍被依赖阻塞</text>

  <!-- parallel agents -->
  <text x="420" y="100" class="small">多个子 Agent · 各自独立 worktree</text>

  <rect x="420" y="140" width="300" height="106" class="agent"/>
  <text x="440" y="176" class="label">子 Agent A</text>
  <text x="440" y="204" class="body">worktree A / branch feat-T3</text>
  <text x="440" y="230" class="small">按 /tdd 红-绿-重构实现</text>

  <rect x="420" y="266" width="300" height="106" class="agent"/>
  <text x="440" y="302" class="label">子 Agent B</text>
  <text x="440" y="330" class="body">worktree B / branch feat-T4</text>
  <text x="440" y="356" class="small">按 /tdd 红-绿-重构实现</text>

  <rect x="420" y="392" width="300" height="106" class="agent"/>
  <text x="440" y="428" class="label">子 Agent C</text>
  <text x="440" y="456" class="body">worktree C / 下一批前沿</text>
  <text x="440" y="482" class="small">前沿更新后再派发</text>

  <path d="M378 176 L420 193" class="flow"/>
  <path d="M378 262 L420 319" class="flow"/>
  <path d="M280 456 L420 445" class="flow"/>

  <!-- integration branch -->
  <text x="800" y="100" class="small">汇入同一条集成分支</text>
  <rect x="800" y="176" width="352" height="70" class="integration"/>
  <text x="820" y="218" class="label">集成分支</text>
  <text x="920" y="218" class="small">merger 子 Agent 逐个合并</text>

  <rect x="800" y="286" width="352" height="70" class="node"/>
  <text x="820" y="328" class="label">/code-review</text>
  <text x="960" y="328" class="small">标准 + spec 双线审查</text>

  <rect x="800" y="396" width="352" height="70" class="node"/>
  <text x="820" y="438" class="label">清理 worktree</text>
  <text x="990" y="438" class="small">报告结果</text>

  <path d="M720 193 L800 211" class="flow"/>
  <path d="M720 319 L800 211" class="flow"/>
  <path d="M720 445 L800 211" class="flow"/>
  <path d="M976 246 L976 286" class="flow"/>
  <path d="M976 356 L976 396" class="flow"/>
</svg>
