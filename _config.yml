# ========== 站点信息 ==========
title: zhouxiong's site
tagline: AI Agent 实践经验 · skill&amp;MCP&amp;工具
description: 记录 AI Agent 实践经验，以及 skill、MCP 和工具的真实使用边界。
lang: zh-CN
url: "https://zhouxiong100.github.io"
baseurl: ""

# ========== 主题 ==========
theme: just-the-docs
# 自定义配色，定义在 _sass/color_schemes/ink.scss
color_scheme: ink

# ========== 导航 ==========
nav_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: 回到顶部

aux_links:
  "GitHub":
    - "https://github.com/zhouxiong100"
aux_links_new_tab: true

# ========== 搜索 ==========
search_enabled: true
search:
  heading_level: 2
  previews: 2
  button: false
  focus_shortcut_key: "k"

# ========== 图表（默认关闭，需要时取消注释）==========
# 打开后每个页面都会加载 mermaid.js，只在确实要画图时开启
# mermaid:
#   version: "11"

# ========== 提示块 ==========
# 用法：段落后面加 {: .tip }
callouts:
  note:
    title: 说明
    color: blue
  tip:
    title: 经验
    color: green
  warn:
    title: 注意
    color: yellow
  pitfall:
    title: 踩坑
    color: red

# ========== 集合 ==========
# 工具页放在 _tools/ 目录，导航分组名见 just_the_docs
collections:
  tools:
    permalink: "/tools/:path/"
    output: true

just_the_docs:
  collections:
    tools:
      name: skill&amp;MCP&amp;工具

# ========== 文章永久链接 ==========
permalink: /posts/:year/:month/:title/

# ========== 默认前置数据 ==========
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav_exclude: true
  - scope:
      path: ""
      type: tools
    values:
      layout: tool

# ========== 页脚 ==========
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d"
gh_edit_link: true
gh_edit_link_text: 在 GitHub 上编辑本页
gh_edit_repository: "https://github.com/zhouxiong100/zhouxiong100.github.io"
gh_edit_branch: main
gh_edit_view_mode: edit

# ========== 插件 ==========
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
